name: Daily data refresh

# Keeps data/*.js|json current without anyone opening a session: runs DAILY at
# 06:00 UTC and on demand (Actions tab -> Run workflow). Daily, not weekly:
# CSO/CBI monthly releases land on arbitrary weekday mornings, so a weekly cron
# can leave the site up to 6 days stale (first run after enabling was the issue
# that prompted this). Runs are cheap and only commit when data actually changed.
# Each fetch script is best-effort (a failure is logged, others still run); the
# commit step is gated on validation passing, so bad data is never published.
# Every push to main triggers a GitHub Pages deploy automatically.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data from official sources
        run: |
          for s in fetch_cso fetch_labour fetch_prices fetch_fiscal fetch_financial fetch_cbi_forecasts; do
            echo "=== scripts/$s.py ==="
            python3 "scripts/$s.py" || echo "WARN: $s failed - continuing with other sources"
          done

      - name: Validate generated data and pages
        run: |
          python3 scripts/validate_data.py
          for f in data/*.js *.js; do node --check "$f" || exit 1; done
          node tests/dom-harness.js
          node tests/palette-audit.js
          node tests/window-audit.js

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes - nothing to commit."
          else
            git commit -m "chore: daily data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
